<section id="projects" class="all-projects-container">
    <div class="section-square"></div>
    <h2>My Projects</h2>
        <div class="project-filters">
            <button class="btn filter-btn active" data-filter="all">All</button>
            <button class="btn filter-btn" data-filter="Python">Python</button>
            <button class="btn filter-btn" data-filter="SQLAlchemy">SQLAlchemy</button>
            <button class="btn filter-btn" data-filter="Pandas">Pandas</button>
            <button class="btn filter-btn" data-filter="NumPy">NumPy</button>
            <button class="btn filter-btn" data-filter="Flask">Flask</button>
            <button class="btn filter-btn" data-filter="Peewee">Peewee</button>
            <button class="btn filter-btn" data-filter="Jupyter Notebook">Jupyter Notebook</button>
            <button class="btn filter-btn" data-filter="HTML">HTML</button>
        </div>
    {% for project in projects %}
    <article class="project-container" data-techs="{{ project.techs | join(',') }}">
      <div class="project-img-container">
        <div class="project-img">
          <img
              src="{{ project.image }}"
              alt="photo of {{ project.name }}"
          />
        </div>
      </div>
      <div class="project-text-container">
        <h3>{{ project.name }}</h3>
        <div class="project-techs">
          {% for tech in project.techs %}
          <span>{{ tech }}</span>
          {% endfor %}
        </div>
        <p class="body-text">
          {{ project.description }}
        </p>
        <div class="project-links">
          {% if project.live %}
          <a href="{{ project.live }}" class="btn">Live Site</a>
          {% endif %}
          <a href="{{ project.repo }}" class="btn">GitHub Repo</a>
        </div>
      </div>
    </article>
    {% endfor %}
</section>
